# Cho phép file .htaccess của WordPress có hiệu lực.
#
# Không có nó, Apache trả 404 cho mọi đường dẫn đẹp (/about/, /process/…) trong khi trang
# chủ vẫn mở được — vì trang chủ không cần rewrite, còn các trang khác thì có. Debian đặt
# AllowOverride None cho /var/www/ theo mặc định, nên chỉ bật mod_rewrite là chưa đủ.
<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
