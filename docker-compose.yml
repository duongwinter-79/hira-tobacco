# Chạy site trên máy: WordPress + MariaDB, lấy từ Docker Hub.
#
# Đường này không cần Node và không gọi wordpress.org — WordPress core nằm sẵn trong
# image. Dùng khi wp-env báo "Could not find the current WordPress version".
#
#   docker compose up -d          bật, mở http://localhost:8888
#   docker compose down           tắt (giữ dữ liệu)
#   docker compose down -v        xoá sạch, cài lại từ đầu
#
# Theme và plugin được mount thẳng từ repo: sửa file, F5 trình duyệt là thấy ngay.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      # Địa chỉ site nhìn từ bên ngoài. "auto" = WordPress lấy địa chỉ từ chính request đang
      # tới, nên link tunnel đổi bao nhiêu lần cũng không phải dựng lại container.
      #
      # Mặc định nằm ngay đây chứ không nằm trong .env. Trước kia .env giữ giá trị này và bị
      # commit để bản clone mới có sẵn — nhưng .env cũng là chỗ để khoá API, nên file đó vừa
      # được git theo dõi vừa chứa bí mật. Để mặc định ở đây thì clone mới vẫn chạy mà không
      # cần .env, và .env trở lại đúng vai trò: chỉ chứa bí mật, không bao giờ commit.
      #
      # Đặt biến môi trường SITE_URL để ghi đè, ví dụ địa chỉ cố định trên hosting thật.
      # Xem docs/chay-thu-local.md, mục "Cho khách xem bản chạy trên máy bạn".
      SITE_URL: ${SITE_URL:-auto}
    volumes:
      - wp-core:/var/www/html
      - ./wp-content/themes/annamleaf:/var/www/html/wp-content/themes/annamleaf
      - ./wp-content/plugins/annamleaf-core:/var/www/html/wp-content/plugins/annamleaf-core
      # Không có dòng này thì /about/ trả 404 trong khi trang chủ vẫn mở được.
      - ./docker/apache-permalinks.conf:/etc/apache2/conf-enabled/zz-annamleaf.conf:ro
      # Đặt SITE_URL khi chạy sau tunnel — mu-plugin nạp ở mọi lần chạy, kể cả install cũ.
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  # Chạy lệnh WordPress từ dòng lệnh, ví dụ:
  #   docker compose run --rm cli wp theme activate annamleaf
  #   docker compose run --rm cli wp eval-file /repo/tools/export-photos.php
  cli:
    image: wordpress:cli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-core:/var/www/html
      - ./wp-content/themes/annamleaf:/var/www/html/wp-content/themes/annamleaf
      - ./wp-content/plugins/annamleaf-core:/var/www/html/wp-content/plugins/annamleaf-core
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # Scripts chạy bằng `wp eval-file`, ví dụ tools/export-photos.php.
      - ./tools:/repo/tools

volumes:
  db-data:
  wp-core:
